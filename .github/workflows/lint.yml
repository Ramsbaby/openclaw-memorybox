name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Lint bin/memorybox
        run: shellcheck -S warning bin/memorybox

      - name: Lint scripts/*.sh
        run: |
          for f in scripts/*.sh; do
            echo "Checking $f..."
            shellcheck -S warning "$f"
          done

      - name: Check install.sh
        run: shellcheck -S warning install.sh
