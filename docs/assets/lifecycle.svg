<svg width="800" height="420" viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1158c7"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a7f37"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
    <linearGradient id="gPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6e40c9"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9e6a03"/>
      <stop offset="100%" stop-color="#d29922"/>
    </linearGradient>
      <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7d8590"/>
    </marker>
  </defs>

  <rect width="800" height="420" fill="url(#bg)" rx="12"/>
  <rect width="800" height="420" fill="none" stroke="#30363d" stroke-width="1" rx="12"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#e6edf3">openclaw-memorybox</text>
  <text x="400" y="56" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#7d8590">Memory Hygiene Lifecycle</text>

  <!-- Center: Memory Store -->
  <circle cx="400" cy="220" r="68" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="400" cy="220" r="60" fill="none" stroke="#1f6feb" stroke-width="1" stroke-dasharray="6,3" opacity="0.5"/>
  <text x="400" y="210" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#e6edf3">Memory</text>
  <text x="400" y="228" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#e6edf3">Store</text>
  <text x="400" y="248" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" fill="#58a6ff">~/.claude/memory/</text>

  <!-- Node: Capture (top-left) -->
  <rect x="60" y="88" width="160" height="64" rx="10" fill="url(#gBlue)" opacity="0.18" stroke="#1f6feb" stroke-width="1"/>
  <text x="140" y="114" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#58a6ff">Capture</text>
  <text x="140" y="133" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" fill="#7d8590">/memorybox capture</text>
  <text x="140" y="147" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" fill="#7d8590">session end hook</text>

  <!-- Node: Inject (top-right) -->
  <rect x="580" y="88" width="160" height="64" rx="10" fill="url(#gGreen)" opacity="0.18" stroke="#2ea043" stroke-width="1"/>
  <text x="660" y="114" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#3fb950">Inject</text>
  <text x="660" y="133" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" fill="#7d8590">session start hook</text>
  <text x="660" y="147" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" fill="#7d8590">injects relevant context</text>

  <!-- Node: Health Check (bottom-left) -->
  <rect x="60" y="290" width="160" height="64" rx="10" fill="url(#gOrange)" opacity="0.18" stroke="#d29922" stroke-width="1"/>
  <text x="140" y="316" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#e3b341">Health Check</text>
  <text x="140" y="335" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" fill="#7d8590">/memorybox health</text>
  <text x="140" y="349" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" fill="#7d8590">staleness · drift · count</text>

  <!-- Node: Prune (bottom-right) -->
  <rect x="580" y="290" width="160" height="64" rx="10" fill="url(#gPurple)" opacity="0.18" stroke="#a371f7" stroke-width="1"/>
  <text x="660" y="316" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#c084fc">&#x2702;&#xFE0F; Prune</text>
  <text x="660" y="335" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" fill="#7d8590">/memorybox prune</text>
  <text x="660" y="349" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" fill="#7d8590">dedupe · expire stale</text>

  <!-- Arrows: Capture → Store -->
  <path d="M 220 120 Q 300 120 332 178" stroke="#1f6feb" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- Arrows: Store → Inject -->
  <path d="M 468 178 Q 500 120 580 120" stroke="#2ea043" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- Arrows: Health → Store -->
  <path d="M 220 322 Q 300 322 332 262" stroke="#d29922" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- Arrows: Store → Prune -->
  <path d="M 468 262 Q 500 322 580 322" stroke="#a371f7" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- Arrows: Prune → Capture (cycle) -->
  <path d="M 660 290 Q 660 240 580 180 Q 500 120 400 80 Q 300 80 220 120" stroke="#30363d" stroke-width="1" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)"/>

  <!-- Tagline -->
  <text x="400" y="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#7d8590">Works alongside Mem0 · Supermemory · QMD — zero dependencies</text>
</svg>